<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#1A1C1E"/>
  <!-- Isometric Grass Block -->
  <g transform="translate(256, 256)">
    <!-- Top Face (Grass) -->
    <polygon points="0,-140 140,-60 0,20 -140,-60" fill="#5B8731"/>
    <polygon points="0,-140 70,-100 0,-60 -70,-100" fill="#709E38"/>
    <polygon points="20,-80 80,-45 40,-20 -20,-55" fill="#4D7428"/>
    <!-- Left Face (Dirt) -->
    <polygon points="-140,-60 0,20 0,160 -140,80" fill="#866043"/>
    <polygon points="-140,-60 0,20 0,50 -20,40 -40,65 -80,35 -100,55 -140,25" fill="#5B8731"/>
    <!-- Right Face (Dirt shaded) -->
    <polygon points="0,20 140,-60 140,80 0,160" fill="#573D26"/>
    <polygon points="0,20 140,-60 140,-30 110,-10 90,-35 50,0 20,-15 0,50" fill="#4D7428"/>
  </g>
</svg>
